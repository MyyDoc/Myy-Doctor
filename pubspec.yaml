name: myydoctor
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  
  flutter:
    sdk: flutter
  carousel_slider: ^5.1.1
  cloud_firestore: ^6.0.1
  cupertino_icons: ^1.0.8
  firebase_core: ^4.1.0
  firebase_auth: ^6.1.2
  google_sign_in: ^6.1.5
  flutter_facebook_auth: ^7.1.2
  sign_in_with_apple: ^7.0.1
  flutter_bloc: ^9.1.1
  font_awesome_flutter: ^10.9.0
  geocoding: ^4.0.0
  geolocator: ^14.0.1
  google_fonts: ^6.3.2
  image_picker: ^1.2.0
  shared_preferences: ^2.5.3
  video_player: ^2.10.0
  firebase_storage: ^13.0.4
  file_picker: ^10.3.7
  firebase_database: ^12.1.0
  vs_story_designer: ^2.2.1
  story_view: ^0.16.6
  cached_network_image: ^3.4.1
  equatable: ^2.0.7

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
  # Remove the fonts section since we'll use google_fonts package
